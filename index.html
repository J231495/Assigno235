<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEZNCOV COMPANIES Registration Form</title>
    <style>
        body {
            background-color: yellow;
            font-size: 15px;
            text-align: center;
            margin: 10px;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: blue;
        }
        table {
            margin: 0 auto; /* Centers the table on the page */
            background-color: white; /* Makes text easier to read against yellow */
        }
        td {
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>JEZNCOV COMPANIES Registration Form</h1>

    <form>
        <table border="1" cellpadding="8">
            <!-- Employee Name -->
            <tr>
                <td><label for="employees_name">Employees Name:</label></td>
                <td><input type="text" id="employees_name" name="employees_name" required></td>
            </tr>
            
            <!-- Age (Date of Birth) -->
            <tr>
                <td><label for="age">Date of Birth / Age:</label></td>
                <td><input type="date" id="age" name="age" required></td>
            </tr>

            <!-- Gender -->
            <tr>
                <td><label>Gender:</label></td>
                <td>
                    <input type="radio" id="gender_m" name="gender" value="male" required> <label presidential for="gender_m">Male</label>
                    <input type="radio" id="gender_f" name="gender" value="female"> <label for="gender_f">Female</label>
                </td>
            </tr>

            <!-- ID Number -->
            <tr>
                <td><label for="id_number">ID Number:</label></td>
                <td><input type="text" id="id_number" name="id_number" required></td>
            </tr>

            <!-- Employee's ID -->
            <tr>
                <td><label for="employee_id">Employee's ID:</label></td>
                <td><input type="text" id="id_number" name="employee_id" required></td>
            </tr>

            <!-- Phone Number -->
            <tr>
                <td><label for="phone_number">Phone Number:</label></td>
                <td><input type="tel" id="phone_number" name="phone_number" required></td>
            </tr>

            <!-- Disability Status -->
            <tr>
                <td><label>Any disability?:</label></td>
                <td>
                    <input type="radio" id="disability_yes" name="disability" value="yes" required> <label for="disability_yes">Yes</label>
                    <input type="radio" id="disability_no" name="disability" value="no"> <label for="disability_no">No</label>
                </td>
            </tr>

            <!-- Describe Disability -->
            <tr>
                <td><label for="disability_desc">Describe disability if you have any:</label></td>
                <td><textarea id="disability_desc" name="disability_desc" rows="2" cols="20"></textarea></td>
            </tr>

            <!-- Address -->
            <tr>
                <td><label for="address">Address:</label></td>
                <td><input type="text" id="address" name="address" required></td>
            </tr>

            <!-- Marital Status -->
            <tr>
                <td><label>Marital Status:</label></td>
                <td>
                    <input type="radio" id="single" name="marital_status" value="single" required> <label for="single">Single</label><br>
                    <input type="radio" id="married" name="marital_status" value="married"> <label for="married">Married</label><br>
                    <input type="radio" id="pnts" name="marital_status" value="prefer_not_to_say"> <label for="pnts">Prefer not to say</label>
                </td>
            </tr>

            <!-- Next of Kin -->
            <tr>
                <td><label id="next_of_kin">Next of Kin Name:</label></td>
                <td><input type="text" id="next_of_kin" name="next_of_kin" required></td>
            </tr>

            <!-- Weight -->
            <tr>
                <td><label for="weight">Weight (kg):</label></td>
                <td><input type="number" id="weight" name="weight" required></td>
            </tr>
            
            <!-- Submit Button -->
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="Register">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
